#       a11_range: [0.65, 0.90]
#       a11_range_message: "CAMRI printer typically gives a11 between 0.75 and 0.85 for T300/PESU."
#   AS4_Epoxy:
#     run_elastic_inverse:
#       matrix_modulus_range: [3000.0, 5000.0]
#       matrix_modulus_range_message: "AS4/Epoxy matrix modulus should be in 3000-5000 MPa range."
#   EGlass:
#     run_elastic_inverse:
#       a11_range: [0.55, 0.80]
#       a11_range_message: "E-Glass composites typically show lower alignment than carbon fiber (0.55-0.75 is normal)."

material_systems: {}
