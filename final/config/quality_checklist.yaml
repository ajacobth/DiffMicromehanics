# Quality Checklist — hard numeric rules for inverse solver results.
#
# Rules are keyed by tool name. Supported rule suffixes:
#   _max     : value must be <= threshold
#   _min     : value must be >= threshold
#   _range   : value must be in [lo, hi]
#
# Add a custom warning by placing a _message key after any rule.
# The message is only shown when that rule FAILS.
#
# Key format for material_systems: short tokens joined by underscores.
# A key matches if every token appears in the fiber OR polymer name (case-insensitive).
#   T300_PESU   matches "T300 Carbon Fiber (Toray)" + "PESU Ultrason (BASF)"
#   AS4_Epoxy   matches "AS4" + "Epoxy 3501-6 (Hexcel)"
#   EGlass      matches "E-Glass ..." on any polymer

global:
  run_elastic_inverse:
    fit_error_max: 0.05
    fit_error_max_message: "High fit error — check for inconsistent measurements or wrong material selection. Adding G12 or nu12 typically helps."

    a11_range: [0.50, 0.90]
    a11_range_message: "Fiber alignment (a11) is outside the expected range. Values below 0.50 suggest poor print alignment — check print direction and nozzle settings."

    a22_range: [0.01, 0.40]

    ar_range: [5.0, 50.0]
    ar_range_message: "Aspect ratio is outside the expected range. Values above 50 are unusual for short fiber-reinforced composites."

    fiber_massfrac_range: [0.05, 0.35]
    fiber_massfrac_range_message: "Mass fraction above 0.35 is high. The micromechanics models in not reliable at high loading concentrations"

    matrix_modulus_range: [1000.0, 6000.0]
    matrix_modulus_range_message: "Matrix modulus is outside the expected polymer range. Check that the correct polymer was selected."

    matrix_poisson_range: [0.30, 0.45]

  run_thermoelastic_inverse:
    fit_error_max: 0.05
    fit_error_max_message: "High fit error — verify that Stage 1 was run on the same material system and that CTE units are in ppm/K."

    f_cte1_ppmK_range: [-2.0, 5.0]
    f_cte1_ppmK_range_message: "Fiber longitudinal CTE (f_cte1) is unusually high. Carbon fibers typically have near-zero or slightly negative longitudinal CTE — verify fiber identity."

    f_cte2_ppmK_range: [5.0, 30.0]
    f_cte2_ppmK_range_message: "Fiber transverse CTE (f_cte2) is outside the expected range. Check CTE22 measurement and units."

    m_cte_ppmK_range: [30.0, 120.0]
    m_cte_ppmK_range_message: "Matrix CTE is outside the expected polymer range. Verify the polymer selection and CTE measurements."

  run_thermal_inverse:
    fit_error_max: 0.10
    fit_error_max_message: "High fit error — ensure the CSV spans at least 50 deg C and that K11 values are in W/m.K."

    k_f1_range: [1.0, 100.0]
    k_f1_range_message: "Fiber longitudinal conductivity (k_f1) is outside the expected range. Check CSV column order (K11, K22, K33)."

    k_f2_range: [0.5, 20.0]
    k_f2_range_message: "Fiber transverse conductivity (k_f2) is outside the expected range."

    k_m_range: [0.1, 2.0]
    k_m_range_message: "Matrix conductivity at 25 deg C is outside the expected polymer range (0.1-2.0 W/m.K)."

# Per-material-system overrides. Uncomment and fill in as you test new systems.
# material_systems:
#   T300_PESU:
