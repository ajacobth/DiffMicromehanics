<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Comparison — CF_T300_techmer_PESU_Electrafil_3DP_CAMRI</title>
<style>
:root {
  --pred:    #2563EB;
  --exp:     #D97706;
  --pred-a:  rgba(37,99,235,0.15);
  --exp-a:   rgba(217,119,6,0.15);
  --bg:      #F8FAFC;
  --card:    #FFFFFF;
  --border:  #E2E8F0;
  --text:    #0F172A;
  --muted:   #64748B;
  --grid:    #F1F5F9;
  font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  font-size: 14px;
  color: var(--text);
  background: var(--bg);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:     #0F172A;
    --card:   #1E293B;
    --border: #334155;
    --text:   #F1F5F9;
    --muted:  #94A3B8;
    --grid:   #1E293B;
    --pred:   #60A5FA;
    --exp:    #FBBF24;
    --pred-a: rgba(96,165,250,0.15);
    --exp-a:  rgba(251,191,36,0.15);
  }
}
:root[data-theme="light"] {
  --bg:#F8FAFC; --card:#FFFFFF; --border:#E2E8F0; --text:#0F172A;
  --muted:#64748B; --grid:#F1F5F9;
  --pred:#2563EB; --exp:#D97706;
  --pred-a:rgba(37,99,235,0.15); --exp-a:rgba(217,119,6,0.15);
}
:root[data-theme="dark"] {
  --bg:#0F172A; --card:#1E293B; --border:#334155; --text:#F1F5F9;
  --muted:#94A3B8; --grid:#1E293B;
  --pred:#60A5FA; --exp:#FBBF24;
  --pred-a:rgba(96,165,250,0.15); --exp-a:rgba(251,191,36,0.15);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { padding: 24px; max-width: 1100px; margin: 0 auto; }
header {
  display: flex; justify-content: space-between; align-items: flex-start;
  margin-bottom: 28px; padding-bottom: 16px; border-bottom: 1px solid var(--border);
}
.title { font-size: 18px; font-weight: 600; }
.subtitle { font-size: 12px; color: var(--muted); margin-top: 4px; letter-spacing: .02em; }
.theme-btn {
  background: none; border: 1px solid var(--border); border-radius: 6px;
  padding: 4px 10px; font-size: 12px; cursor: pointer; color: var(--muted);
}
.legend {
  display: flex; gap: 20px; margin-bottom: 20px; align-items: center;
}
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.swatch { width: 20px; height: 3px; border-radius: 2px; }
.swatch-exp { background: var(--exp); border-top: 2px dashed var(--exp); height:0; }
.charts { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
.chart-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 10px; padding: 20px;
}
.chart-card.full { grid-column: 1 / -1; }
.chart-title { font-size: 13px; font-weight: 600; margin-bottom: 16px; letter-spacing: .02em; text-transform: uppercase; color: var(--muted); }
canvas { display: block; width: 100%; }
.tooltip {
  position: fixed; pointer-events: none; display: none;
  background: var(--card); border: 1px solid var(--border);
  border-radius: 6px; padding: 8px 12px; font-size: 12px;
  box-shadow: 0 4px 12px rgba(0,0,0,.12);
  font-variant-numeric: tabular-nums;
  z-index: 100;
}
.tooltip b { color: var(--text); font-weight: 600; }
.tooltip span { color: var(--muted); }
@media (max-width: 640px) { .charts { grid-template-columns: 1fr; } .chart-card.full { grid-column: 1; } }
</style>
</head>
<body>
<header>
  <div>
    <div class="title">CF_T300_techmer_PESU_Electrafil_3DP_CAMRI</div>
    <div class="subtitle">Carbon Fiber T300_techmer &nbsp;/&nbsp; PESU_Electrafil_3DP &nbsp;/&nbsp; CAMRI</div>
  </div>
  <button class="theme-btn" onclick="toggleTheme()">Toggle theme</button>
</header>
<div class="legend">
  <div class="legend-item"><div class="swatch" style="background:var(--pred)"></div> Predicted (surrogate)</div>
  <div class="legend-item"><div class="swatch" style="background:var(--exp); height:0; border-top:2px dashed var(--exp); width:20px"></div> Experimental</div>
</div>
<div class="charts">
  <div class="chart-card"><div class="chart-title">Elastic Properties</div><canvas id="cElastic" height="220"></canvas></div>
  <div class="chart-card"><div class="chart-title">Thermoelastic (CTE)</div><canvas id="cCTE" height="220"></canvas></div>
  <div class="chart-card full"><div class="chart-title">Thermal Conductivity vs Temperature</div><canvas id="cThermal" height="320"></canvas></div>
</div>
<div class="tooltip" id="tip"></div>
<script>
const DATA = {"card_name": "CF_T300_techmer_PESU_Electrafil_3DP_CAMRI", "fiber": "Carbon Fiber T300_techmer", "polymer": "PESU_Electrafil_3DP", "printer": "CAMRI", "elastic": [{"label": "E1", "unit": "GPa", "pred": 16.92, "exp": 16.92}, {"label": "E2", "unit": "GPa", "pred": 4.85, "exp": 4.85}, {"label": "E3", "unit": "GPa", "pred": 3.79, "exp": 3.79}, {"label": "G12", "unit": "GPa", "pred": 2.61, "exp": null}, {"label": "nu12", "unit": "\u2014", "pred": 0.44, "exp": null}], "cte": [{"label": "CTE11", "unit": "ppm/K", "pred": 4.315, "exp": 4.19}, {"label": "CTE22", "unit": "ppm/K", "pred": 34.699, "exp": 35.08}, {"label": "CTE33", "unit": "ppm/K", "pred": 64.9, "exp": 65.0}], "thermal_pred": {"T": [25.0, 25.1, 25.2, 25.5, 25.8, 26.2, 40.0, 40.1, 55.0, 70.0, 85.0, 100.0, 115.0, 130.0, 145.0, 160.0, 175.0, 190.0], "K11": [1.6150271892547607, 1.615201711654663, 1.615376591682434, 1.6158982515335083, 1.616416573524475, 1.6171032190322876, 1.6386799812316895, 1.6388217210769653, 1.6582632064819336, 1.675321102142334, 1.6905896663665771, 1.7043101787567139, 1.7170658111572266, 1.7290138006210327, 1.7402902841567993, 1.751075029373169, 1.7614015340805054, 1.7714804410934448], "K22": [0.5350825786590576, 0.5351699590682983, 0.5352573394775391, 0.5355184078216553, 0.535777747631073, 0.5361214876174927, 0.5474220514297485, 0.5474981665611267, 0.5578986406326294, 0.5670452117919922, 0.575308084487915, 0.5829602479934692, 0.5902169942855835, 0.5970137119293213, 0.6034291386604309, 0.6095243096351624, 0.6153396964073181, 0.6209520101547241], "K33": [0.29178929328918457, 0.29184767603874207, 0.2919057309627533, 0.292080283164978, 0.29225340485572815, 0.29248306155204773, 0.3006526231765747, 0.3007091283798218, 0.30845481157302856, 0.31523025035858154, 0.32128801941871643, 0.32696837186813354, 0.3323971629142761, 0.3374819755554199, 0.34228014945983887, 0.3468768000602722, 0.35128581523895264, 0.35542985796928406]}, "thermal_exp": {"K11": {"T": [26.2, 25.8, 25.5, 40.1, 40.0, 40.0, 55.0, 55.0, 55.0, 70.0, 70.0, 70.0, 85.0, 85.0, 85.0, 100.0, 100.0, 100.0, 115.0, 115.0, 115.0, 130.0, 130.0, 130.0, 145.0, 145.0, 145.0, 160.0, 160.0, 160.0, 175.0, 175.0, 175.0, 190.0, 190.0, 190.0], "K": [1.43, 1.46, 1.4, 1.43, 1.51, 1.48, 1.48, 1.5, 1.53, 1.53, 1.58, 1.54, 1.58, 1.62, 1.58, 1.61, 1.63, 1.64, 1.59, 1.72, 1.69, 1.65, 1.74, 1.71, 1.67, 1.73, 1.68, 1.69, 1.78, 1.74, 1.73, 1.75, 1.79, 1.78, 1.78, 1.82]}, "K22": {"T": [25.2, 25.1, 25.1, 40.0, 40.0, 40.0, 55.0, 55.0, 55.0, 70.0, 70.0, 70.0, 85.0, 85.0, 85.0, 100.0, 100.0, 100.0, 115.0, 115.0, 115.0, 130.0, 130.0, 130.0, 145.0, 145.0, 145.0, 160.0, 160.0, 160.0, 175.0, 175.0, 175.0, 190.0, 190.0, 190.0], "K": [0.557, 0.555, 0.552, 0.556, 0.572, 0.575, 0.579, 0.576, 0.578, 0.587, 0.597, 0.584, 0.604, 0.608, 0.605, 0.614, 0.621, 0.621, 0.648, 0.637, 0.633, 0.641, 0.652, 0.652, 0.643, 0.643, 0.613, 0.65, 0.658, 0.649, 0.662, 0.651, 0.642, 0.668, 0.662, 0.656]}, "K33": {"T": [25.1, 25.0, 25.0, 40.0, 40.0, 40.0, 55.0, 55.0, 55.0, 70.0, 70.0, 70.0, 85.0, 85.0, 85.0, 100.0, 100.0, 100.0, 115.0, 115.0, 115.0, 130.0, 130.0, 130.0, 145.0, 145.0, 145.0, 160.0, 160.0, 160.0, 175.0, 175.0, 175.0, 190.0, 190.0, 190.0], "K": [0.294, 0.3, 0.295, 0.297, 0.305, 0.3, 0.304, 0.309, 0.308, 0.31, 0.311, 0.313, 0.316, 0.327, 0.319, 0.321, 0.321, 0.319, 0.324, 0.326, 0.329, 0.324, 0.33, 0.339, 0.333, 0.334, 0.338, 0.338, 0.333, 0.336, 0.339, 0.339, 0.344, 0.341, 0.339, 0.341]}}};
const tip  = document.getElementById('tip');

function getCSSVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function colors() {
  return {
    pred:   getCSSVar('--pred'),
    exp:    getCSSVar('--exp'),
    predA:  getCSSVar('--pred-a'),
    expA:   getCSSVar('--exp-a'),
    muted:  getCSSVar('--muted'),
    text:   getCSSVar('--text'),
    border: getCSSVar('--border'),
    grid:   getCSSVar('--grid'),
  };
}

// ── horizontal grouped bar chart ─────────────────────────────────────────────
function drawBars(canvasId, rows, decimalPlaces=2) {
  const canvas = document.getElementById(canvasId);
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.parentElement.clientWidth - 40;
  const H = parseInt(canvas.getAttribute('height'));
  canvas.width  = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const C = colors();
  const labelW = 60, pad = 16, barH = 14, gap = 4, groupGap = 18;
  const maxVal = Math.max(...rows.flatMap(r => [r.pred||0, r.exp||0])) * 1.12;
  const chartW = W - labelW - pad * 2;

  rows.forEach((row, i) => {
    const y0 = pad + i * (2*barH + gap + groupGap);
    // label
    ctx.fillStyle = C.muted; ctx.font = '11px -apple-system,sans-serif';
    ctx.textBaseline = 'middle';
    ctx.fillText(row.label, 0, y0 + barH);

    const toX = v => labelW + (v / maxVal) * chartW;

    // pred bar
    if (row.pred !== null) {
      const bw = (row.pred / maxVal) * chartW;
      ctx.fillStyle = C.predA;
      ctx.fillRect(labelW, y0, bw, barH);
      ctx.strokeStyle = C.pred; ctx.lineWidth = 1.5;
      ctx.strokeRect(labelW, y0, bw, barH);
      ctx.fillStyle = C.pred; ctx.font = '11px ui-monospace,monospace';
      ctx.textBaseline = 'middle';
      ctx.fillText(row.pred.toFixed(decimalPlaces) + ' ' + (row.unit||''), labelW + bw + 4, y0 + barH/2);
    }
    // exp bar
    if (row.exp !== null) {
      const bw = (row.exp / maxVal) * chartW;
      const y1 = y0 + barH + gap;
      ctx.fillStyle = C.expA;
      ctx.fillRect(labelW, y1, bw, barH);
      ctx.strokeStyle = C.exp; ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 3]);
      ctx.strokeRect(labelW, y1, bw, barH);
      ctx.setLineDash([]);
      ctx.fillStyle = C.exp; ctx.font = '11px ui-monospace,monospace';
      ctx.textBaseline = 'middle';
      ctx.fillText(row.exp.toFixed(decimalPlaces) + ' ' + (row.unit||''), labelW + bw + 4, y1 + barH/2);
    }
  });

  // hover: find nearest row, show tooltip
  canvas.onmousemove = (e) => {
    const rect = canvas.getBoundingClientRect();
    const my = e.clientY - rect.top;
    const idx = Math.floor((my - pad) / (2*barH + gap + groupGap));
    if (idx >= 0 && idx < rows.length) {
      const r = rows[idx];
      const diff = (r.pred !== null && r.exp !== null)
        ? ((r.pred - r.exp) / r.exp * 100).toFixed(1) + '%'
        : '—';
      tip.innerHTML = `<b>${r.label}</b><br>
        <span style="color:var(--pred)">&#9632;</span> Predicted: <b>${r.pred ?? '—'} ${r.unit}</b><br>
        <span style="color:var(--exp)">&#9632;</span> Measured: <b>${r.exp ?? '—'} ${r.unit}</b><br>
        <span>Δ: ${diff}</span>`;
      tip.style.display = 'block';
      tip.style.left = (e.clientX + 12) + 'px';
      tip.style.top  = (e.clientY - 10) + 'px';
    }
  };
  canvas.onmouseleave = () => tip.style.display = 'none';
}

// ── thermal line + scatter chart ──────────────────────────────────────────────
function drawThermal(canvasId) {
  const canvas = document.getElementById(canvasId);
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.parentElement.clientWidth - 40;
  const H = parseInt(canvas.getAttribute('height'));
  canvas.width  = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const C = colors();
  const pad = { t:16, r:40, b:40, l:52 };
  const cW = W - pad.l - pad.r;
  const cH = H - pad.t - pad.b;

  const pred = DATA.thermal_pred;
  const exp  = DATA.thermal_exp;

  if (!pred.T || pred.T.length === 0) {
    ctx.fillStyle = C.muted; ctx.font='13px sans-serif'; ctx.textAlign='center';
    ctx.fillText('No thermal prediction data stored for this card.', W/2, H/2);
    return;
  }

  // collect all values for y range
  const allK = [
    ...pred.K11, ...pred.K22, ...pred.K33,
    ...(exp.K11 ? exp.K11.K : []),
    ...(exp.K22 ? exp.K22.K : []),
    ...(exp.K33 ? exp.K33.K : []),
  ];
  const allT = [
    ...pred.T,
    ...(exp.K11 ? exp.K11.T : []),
    ...(exp.K22 ? exp.K22.T : []),
    ...(exp.K33 ? exp.K33.T : []),
  ];
  const Tmin = Math.min(...allT), Tmax = Math.max(...allT);
  const Kmin = 0, Kmax = Math.max(...allK) * 1.1;

  const tx = T => pad.l + (T - Tmin) / (Tmax - Tmin) * cW;
  const ty = K => pad.t + cH - (K - Kmin) / (Kmax - Kmin) * cH;

  // grid
  ctx.strokeStyle = C.border; ctx.lineWidth = 0.5;
  const nGridY = 5;
  for (let i=0; i<=nGridY; i++) {
    const K = Kmin + (Kmax - Kmin) * i / nGridY;
    const y = ty(K);
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(pad.l+cW, y); ctx.stroke();
    ctx.fillStyle = C.muted; ctx.font='10px ui-monospace,monospace';
    ctx.textAlign='right'; ctx.textBaseline='middle';
    ctx.fillText(K.toFixed(2), pad.l - 6, y);
  }
  const nGridX = 6;
  for (let i=0; i<=nGridX; i++) {
    const T = Tmin + (Tmax - Tmin) * i / nGridX;
    const x = tx(T);
    ctx.beginPath(); ctx.moveTo(x, pad.t); ctx.lineTo(x, pad.t+cH); ctx.stroke();
    ctx.fillStyle = C.muted; ctx.textAlign='center'; ctx.textBaseline='top';
    ctx.fillText(Math.round(T) + '°', x, pad.t + cH + 4);
  }

  // axis labels
  ctx.save(); ctx.translate(12, pad.t + cH/2); ctx.rotate(-Math.PI/2);
  ctx.fillStyle = C.muted; ctx.font='11px sans-serif'; ctx.textAlign='center';
  ctx.fillText('Conductivity (W/m·K)', 0, 0); ctx.restore();
  ctx.fillStyle = C.muted; ctx.font='11px sans-serif'; ctx.textAlign='center';
  ctx.fillText('Temperature (°C)', pad.l + cW/2, H - 4);

  // channel styles: K11 blue, K22 teal, K33 purple
  const CH = [
    { key:'K11', color:'#2563EB', dash:[],      label:'K₁₁' },
    { key:'K22', color:'#0891B2', dash:[6,3],   label:'K₂₂' },
    { key:'K33', color:'#7C3AED', dash:[2,3],   label:'K₃₃' },
  ];
  // dark overrides
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark'
    || (window.matchMedia('(prefers-color-scheme:dark)').matches && !document.documentElement.getAttribute('data-theme'));
  if (isDark) {
    CH[0].color = '#60A5FA';
    CH[1].color = '#22D3EE';
    CH[2].color = '#A78BFA';
  }

  CH.forEach(ch => {
    const ys = pred[ch.key];
    if (!ys || !ys.length) return;

    // predicted line
    ctx.beginPath();
    ctx.strokeStyle = ch.color; ctx.lineWidth = 2;
    ctx.setLineDash(ch.dash);
    pred.T.forEach((T, i) => {
      i === 0 ? ctx.moveTo(tx(T), ty(ys[i])) : ctx.lineTo(tx(T), ty(ys[i]));
    });
    ctx.stroke(); ctx.setLineDash([]);

    // direct label at last point
    const lastT = pred.T[pred.T.length-1];
    const lastK = ys[ys.length-1];
    ctx.fillStyle = ch.color; ctx.font='bold 11px sans-serif';
    ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillText(ch.label, tx(lastT)+4, ty(lastK));

    // experimental scatter
    const edata = exp[ch.key];
    if (!edata) return;
    edata.T.forEach((T, i) => {
      const K = edata.K[i];
      ctx.beginPath();
      ctx.arc(tx(T), ty(K), 3.5, 0, Math.PI*2);
      ctx.fillStyle = ch.color; ctx.globalAlpha = 0.7;
      ctx.fill();
      ctx.strokeStyle = ch.color; ctx.lineWidth=1; ctx.globalAlpha=1;
      ctx.stroke();
    });
  });

  // hover crosshair
  let hoverT = null;
  canvas.onmousemove = (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    if (mx < pad.l || mx > pad.l+cW || my < pad.t || my > pad.t+cH) {
      tip.style.display='none'; return;
    }
    const T_val = Tmin + (mx - pad.l) / cW * (Tmax - Tmin);
    // find nearest index in pred.T
    let ni = 0;
    pred.T.forEach((t,i) => { if (Math.abs(t-T_val) < Math.abs(pred.T[ni]-T_val)) ni=i; });
    const T_near = pred.T[ni];
    const vals = CH.map(ch => `<span style="color:${ch.color}">&#9632;</span> ${ch.label}: <b>${pred[ch.key][ni].toFixed(4)} W/m·K</b>`).join('<br>');
    tip.innerHTML = `<b>${Math.round(T_near)}°C</b><br>${vals}`;
    tip.style.display='block';
    tip.style.left=(e.clientX+14)+'px';
    tip.style.top=(e.clientY-10)+'px';
  };
  canvas.onmouseleave = () => tip.style.display='none';
}

function render() {
  drawBars('cElastic', DATA.elastic, 3);
  drawBars('cCTE',     DATA.cte,     2);
  drawThermal('cThermal');
}

function toggleTheme() {
  const root = document.documentElement;
  const cur  = root.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  root.setAttribute('data-theme', next);
  render();
}

window.addEventListener('load', render);
window.addEventListener('resize', render);
</script>
</body>
</html>
